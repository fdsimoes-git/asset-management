# Creates a git tag + GitHub Release. Exists because repo rules route
# normal pushes through PRs and tag pushes / workflow dispatches are
# blocked for automation credentials — the Actions token below is the
# one sanctioned write path for tags/releases.
#
# Two triggers:
#   1. Push to main touching .github/release-request.json — the request
#      file declares tag/title/target/notes; committing it IS the release
#      action (idempotent: re-pushes of an already-released tag no-op).
#   2. Manual workflow_dispatch with explicit inputs.
name: Create Release

on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to create (e.g. v4.0.1)'
        required: true
        type: string
      release_name:
        description: 'Release title'
        required: true
        type: string
      target:
        description: 'Commit SHA or branch the tag should point at'
        required: false
        default: 'main'
        type: string
      body_base64:
        description: 'Release notes markdown, base64-encoded (UTF-8)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'

      - name: Create release from request file
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r '.tag' .github/release-request.json)
          TITLE=$(jq -r '.title' .github/release-request.json)
          TARGET=$(jq -r '.target // "main"' .github/release-request.json)
          NOTES=$(jq -r '.notes' .github/release-request.json)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "$TITLE" \
            --notes-file "$NOTES"

      - name: Create release from dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          TITLE: ${{ inputs.release_name }}
          TARGET: ${{ inputs.target }}
          BODY_B64: ${{ inputs.body_base64 }}
        run: |
          printf '%s' "$BODY_B64" | base64 -d > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md"
