# Creates a git tag + GitHub Release from a manual dispatch.
# Exists because repo rules route normal pushes through PRs and tag
# pushes are blocked for automation credentials — the Actions token
# below is the one sanctioned write path for tags/releases.
name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to create (e.g. v4.0.1)'
        required: true
        type: string
      release_name:
        description: 'Release title'
        required: true
        type: string
      target:
        description: 'Commit SHA or branch the tag should point at'
        required: false
        default: 'main'
        type: string
      body_base64:
        description: 'Release notes markdown, base64-encoded (UTF-8)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          TITLE: ${{ inputs.release_name }}
          TARGET: ${{ inputs.target }}
          BODY_B64: ${{ inputs.body_base64 }}
        run: |
          printf '%s' "$BODY_B64" | base64 -d > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md"
